[project]
name = "moonai-ml"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "boto3>=1.44.10",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.18.0",
    "numpy>=2.5.5",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "onnxscript>=0.7.2",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "sqlalchemy>=2.1.9",
    "tables>=3.11.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
moonai-ml = "moonai_ml:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "streamlit>=1.67.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

# CI/Linux: CPU-only torch wheels (avoids ~2.5 GB of CUDA libraries). macOS keeps the MPS build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
