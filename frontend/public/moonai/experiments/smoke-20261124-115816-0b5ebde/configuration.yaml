profile: smoke
seed: 42
data:
  n_train: 64
  n_val: 32
  n_test: 0
  fixed_val_samples: 4
model:
  filters: 16
  dropout: 0.15
train:
  epochs: 3
  batch_size: auto
  lr: 0.0001
  weight_decay: 1.0e-06
  early_stopping_patience: 5
  activation_epochs:
  - 1
  - 3
  eval_tiles_per_epoch: 64
  progress_every_steps: 20
evaluation:
  template_thresh: 0.5
  target_thresh: 0.1
  min_radius_px: 5
  max_radius_px: 40
  longlat_thresh2: 1.8
  rad_thresh: 1.0
gate:
  min_val_f1: 0.0
  allow_publish: false
  max_onnx_mb: 60.0
  onnx_atol: 0.001
publish:
  keep_versions: 5
  max_upload_mb: 50.0
